name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without 'v' prefix)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: "Prepare v${{ inputs.version }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION}"

          if [[ "${VERSION}" == v* ]]; then
            echo "Release version must not include a leading 'v': ${VERSION}" >&2
            exit 1
          fi

          if [[ ! "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be semver-shaped: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@stable

      - name: Update package version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Bump the first `version = "..."` under [package] only.
          perl -0pi -e 's/(\[package\]\s*(?:(?!^\[).*\n)*?version\s*=\s*")[^"]+(")/$1$ENV{RELEASE_VERSION}$2/m' Cargo.toml

          ACTUAL="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "${ACTUAL}" != "${RELEASE_VERSION}" ]]; then
            echo "Cargo.toml package version was not updated to ${RELEASE_VERSION} (got ${ACTUAL})" >&2
            exit 1
          fi

      - name: Regenerate Cargo.lock
        run: cargo generate-lockfile

      - name: Open release preparation PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_AUTH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          BRANCH="release/v${RELEASE_VERSION}"
          TITLE="chore(release): prepare v${RELEASE_VERSION}"

          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "No release preparation changes were produced for v${RELEASE_VERSION}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B "${BRANCH}"
          git add Cargo.toml Cargo.lock
          git commit -m "${TITLE}"
          git push --force-with-lease origin "${BRANCH}"

          cat > release-pr-body.md <<EOF
          Prepare repository release state for v${RELEASE_VERSION}.

          This PR updates the package version and refreshes Cargo.lock. After it
          merges, main represents the release candidate for tag v${RELEASE_VERSION}.

          This PR is labeled \`release\`. After merge, the "Create Release Tag"
          workflow creates tag v${RELEASE_VERSION} at the merge commit and the
          publish workflow runs from that tag.
          EOF

          if gh pr view "${BRANCH}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh pr edit "${BRANCH}" --repo "${GH_REPO}" --title "${TITLE}" --body-file release-pr-body.md --add-label release
          else
            gh pr create --repo "${GH_REPO}" --base main --head "${BRANCH}" --title "${TITLE}" --body-file release-pr-body.md --label release
          fi
