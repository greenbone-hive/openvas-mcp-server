name: Create Release Tag

on:
  pull_request:
    branches: [main]
    types: [closed, labeled]

permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  RELEASE_LABEL: release

jobs:
  tag:
    name: Create release tag
    if: ${{ github.event.pull_request.merged == true && (github.event.action == 'closed' || github.event.label.name == 'release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create tag for labeled release PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          CURRENT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Read the first `version = "..."` under [package].
          parse_package_version() {
            awk '
              $0 == "[package]" { in_block = 1; next }
              /^\[/ && $0 != "[package]" { in_block = 0 }
              in_block && $1 == "version" {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' "$1"
          }

          PR_LABELS="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          if ! grep -Fxq "${RELEASE_LABEL}" <<<"${PR_LABELS}"; then
            echo "Merged PR #${PR_NUMBER} does not have label '${RELEASE_LABEL}'; skipping release tag creation"
            exit 0
          fi

          if ! git show "${PREVIOUS_SHA}:Cargo.toml" > /tmp/previous-Cargo.toml 2>/dev/null; then
            echo "Previous commit has no Cargo.toml; skipping release tag creation"
            exit 0
          fi

          PREVIOUS_VERSION="$(parse_package_version /tmp/previous-Cargo.toml)"
          CURRENT_VERSION="$(parse_package_version Cargo.toml)"

          if [[ -z "${CURRENT_VERSION}" ]]; then
            echo "Could not read current package version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "${CURRENT_VERSION}" == "${PREVIOUS_VERSION}" ]]; then
            echo "Package version is unchanged at ${CURRENT_VERSION}; skipping release tag creation"
            exit 0
          fi

          if [[ ! "${CURRENT_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Package version is not semver-shaped: ${CURRENT_VERSION}" >&2
            exit 1
          fi

          TAG="v${CURRENT_VERSION}"

          git fetch --force --tags origin

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            if [[ "${TAG_SHA}" == "${CURRENT_SHA}" ]]; then
              echo "Tag ${TAG} already points at ${CURRENT_SHA}; nothing to do"
              exit 0
            fi

            echo "Tag ${TAG} already exists at ${TAG_SHA}, not ${CURRENT_SHA}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${RELEASE_AUTH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -a "${TAG}" "${CURRENT_SHA}" -m "Release ${TAG}"
          git push origin "${TAG}"

          echo "Created ${TAG} from release PR #${PR_NUMBER}"
