name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run tests
        run: cargo test --all-features

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: cargo build --release

      - name: Smoke-test CLI
        run: |
          ./target/release/gvm-mcp --help
          ./target/release/gvm-mcp --list-toolsets

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t gvm-mcp:ci .

      - name: Smoke-test image
        run: docker run --rm gvm-mcp:ci --list-toolsets

  gateway-sync:
    name: Gateway contract sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out rust-gvm-api (spec source of truth)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: greenbone-hive/rust-gvm-api
          ref: main
          path: rust-gvm-api
          sparse-checkout: spec/rest-api

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Verify every gateway operation maps to a tool (and vice versa)
        run: python3 scripts/gateway_sync_check.py --spec rust-gvm-api/spec/rest-api

  release-tooling:
    name: Release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned release verification dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          -r .github/requirements/release.txt

      - name: Test the release helpers and workflow policy
        run: |
          python -m unittest \
            tests.test_release_commit \
            tests.test_release_version \
            tests.test_sbom_postprocess \
            tests.test_sbom_quality \
            tests.test_verify_release \
            tests.test_wait_for_release_run \
            tests.test_workflow_policy
