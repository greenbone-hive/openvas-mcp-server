[project]
name = "openvas-mcp-docs"
version = "0.0.0"
description = "Documentation for OpenVAS-MCP, the MCP server for Greenbone Vulnerability Management"
requires-python = ">=3.12"
dependencies = [
    "sphinx>=9.1.0",
    "myst-parser>=5.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-tabs>=3.5.0",
    "sphinxext-opengraph>=0.13.0",
    "furo>=2025.12.19",
]

[dependency-groups]
dev = ["sphinx-autobuild>=2025.8.25"]

[tool.uv]
package = false
